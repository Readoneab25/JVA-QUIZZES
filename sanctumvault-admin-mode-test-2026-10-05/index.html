<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SanctumVault Admin Mode Test</title><style>body{font-family:Inter,system-ui,Arial;background:#111827;color:#f9fafb;margin:0;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#1f2937;border-radius:16px;padding:22px;margin-bottom:16px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border-radius:9px;border:1px solid #374151;background:#111827;color:#fff}button{padding:11px 16px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.choice{padding:12px;margin:8px 0;background:#374151;border-radius:9px;cursor:pointer}.selected{outline:2px solid #22d3ee}.muted{color:#9ca3af}.pending{padding:15px;border-radius:10px;background:#374151}</style></head><body><div class="wrap"><div class="card"><h1 id="title"></h1><p id="meta" class="muted"></p></div><div class="card" id="intro"><label>Name</label><input id="name"><label>Institution</label><input id="institution"><button id="start">Start Quiz</button></div><div class="card" id="quiz" style="display:none"><p id="progress"></p><div id="area"></div><button id="prev">Previous</button> <button id="next">Next</button> <button id="submit">Submit</button></div><div class="card" id="result" style="display:none"><h2 id="score"></h2><p id="message"></p><a id="receipt" href="https://www.sanctumvault.com.ng/quiz-result" target="_blank">Open result receipt</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="quiz-config.js"></script><script src="quiz-questions.js"></script><script>const cfg=QUIZ_CONFIG,total=QUESTIONS.length;document.getElementById("title").textContent=cfg.title;document.getElementById("meta").textContent=cfg.subject+" • "+cfg.quizNumber+" • "+total+" questions";const sb=window.supabase.createClient("https://mgmckntsfukikkmwdsee.supabase.co","sb_publishable_msspxVHxSKf9lZ6oXR-nbw_Ds3QLUTM");let idx=0,answers=Array(total).fill(null),name="",institution="",done=false;function render(){const q=QUESTIONS[idx];document.getElementById("progress").textContent="Question "+(idx+1)+" of "+total;document.getElementById("area").innerHTML="<h2>"+q.q+"</h2>"+q.c.map((x,i)=>'<div class="choice '+(answers[idx]===i?"selected":"")+'" data-i="'+i+'">'+String.fromCharCode(65+i)+". "+x+"</div>").join("");document.querySelectorAll(".choice").forEach(e=>e.onclick=()=>{answers[idx]=Number(e.dataset.i);render()})}document.getElementById("start").onclick=()=>{name=document.getElementById("name").value.trim();institution=document.getElementById("institution").value.trim()||"Not provided";if(!name)return alert("Enter your name.");document.getElementById("intro").style.display="none";document.getElementById("quiz").style.display="block";render()};document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render()}};document.getElementById("next").onclick=()=>{if(idx<total-1){idx++;render()}};document.getElementById("submit").onclick=async()=>{if(done)return;done=true;let score=0;const stored=QUESTIONS.map((q,i)=>{const ok=answers[i]===q.a;if(ok)score++;return{questionNumber:i+1,question:q.q,selectedIndex:answers[i],selectedAnswer:answers[i]==null?"No answer":q.c[answers[i]]}});const pct=Math.round(score/total*100);const {data,error}=await sb.rpc("submit_quiz_result",{p_quiz_id:cfg.id,p_quiz_name:cfg.title,p_student_name:name,p_institution:institution,p_score:score,p_total_questions:total,p_percentage:pct,p_answers:stored});document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";if(error){document.getElementById("score").textContent="Submission error";document.getElementById("message").textContent=error.message;return}const row=data&&data[0];if(row&&row.result_token)localStorage.setItem("sv_last_quiz_result_token",row.result_token);if(row&&row.show_score){document.getElementById("score").textContent="You scored "+row.score+" / "+row.total_questions;document.getElementById("message").textContent="Result released immediately."}else{document.getElementById("score").textContent="Quiz submitted";document.getElementById("message").textContent="Result is hidden until the tutor releases it."}};</script></body></html>
