<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SanctumVault Quiz</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0b1024;color:#f4f6ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-size:1.35rem;font-weight:800;color:#67e8f9}.timer{font-variant-numeric:tabular-nums;font-weight:800}.card{background:#25296c;border:1px solid #444d91;border-radius:18px;padding:18px;margin:16px 0}input{width:100%;padding:13px;margin:6px 0 12px;background:#151c45;color:white;border:1px solid #6671ad;border-radius:9px;font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#6e61ee;color:white;padding:11px 15px;font:inherit;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#444d83}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.choices{display:grid;gap:10px;margin:18px 0}.choice{display:block;text-align:left;width:100%;background:#403bcb}.choice.selected{outline:3px solid #67e8f9}.navigator{border:1px solid #555b9a;border-radius:12px;padding:12px;margin:20px 0;background:#20265b}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tab{background:#333a74;font-size:12px;padding:8px}.tab.active{background:#22d3ee;color:#062332}.numbers{height:126px;overflow:auto;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));align-content:start;gap:6px}.number{padding:0;height:36px;min-width:0;background:#64748b;font-size:12px}.number.answered{background:#15803d}.number.skipped{background:#b91c1c}.number.current{outline:2px solid #fbbf24;outline-offset:-2px}.legend{font-size:12px;line-height:1.7;color:#d7dcf7;margin-top:10px}.muted{color:#cbd5e1}.review{padding:12px 0;border-bottom:1px solid #596097}.error{color:#fda4af}h1,h2,h3{line-height:1.3}@media(max-width:600px){.numbers{grid-template-columns:repeat(6,minmax(0,1fr))}.wrap{padding:10px}.card{padding:13px}.number{height:40px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">SanctumVault</div><div class="timer" id="timer">--:--</div></div><section class="card" id="intro"><h1 id="title">Practice Quiz</h1><p class="muted">Enter your details to begin. No account required.</p><label for="name">Full name</label><input id="name" maxlength="120" autocomplete="name"><label for="institution">Institution</label><input id="institution" maxlength="120"><p class="error" id="notice"></p><button id="start" disabled>Quiz not yet available</button></section><section class="card" id="quiz" hidden><div class="row"><strong id="position"></strong><span id="answered"></span></div><p class="muted" id="subject"></p><h2 id="question"></h2><div class="choices" id="choices"></div><section class="navigator"><div class="row"><strong>Question Navigator</strong><span class="muted" id="stats"></span></div><div class="tabs" id="tabs"></div><div class="numbers" id="numbers"></div><div class="legend">🟩 Answered &nbsp; 🟥 Skipped &nbsp; ⬜ Not visited &nbsp; 🟨 Current</div></section><div class="row"><div><button class="secondary" id="prev">Previous</button> <button id="next">Next</button></div><button id="submit">Submit quiz</button></div><p class="error" id="submitError" role="alert"></p></section><section class="card" id="result" hidden><h2 id="resultTitle"></h2><p id="resultSummary"></p><div id="review"></div></section></main><script src="quiz-config.js"></script><script src="quiz-questions.js"></script><script>
"use strict";const cfg=window.QUIZ_CONFIG,questions=window.QUESTIONS||[],total=questions.length;let idx=0,seconds=cfg.timeMinutes*60,timer=null,submitting=false,finished=false,activeSubject="All";const answers=Array(total).fill(null),visited=new Set(),skipped=new Set();const el=id=>document.getElementById(id);el("title").textContent=cfg.title;const valid=total>0&&questions.every(q=>q&&typeof q.q==="string"&&q.q.trim()&&Array.isArray(q.c)&&q.c.length===4&&q.c.every(x=>typeof x==="string"&&x.trim())&&Number.isInteger(q.a)&&q.a>=0&&q.a<4);const ready=cfg.ready===true&&valid&&typeof cfg.submissionEndpoint==="string"&&cfg.submissionEndpoint.startsWith("https://");el("notice").textContent=ready?"":"Template awaiting questions and secure anonymous results integration.";el("start").disabled=!ready;if(ready)el("start").textContent="Start quiz";
function render(){const q=questions[idx];el("position").textContent="Question "+(idx+1)+" of "+total;el("answered").textContent=answers.filter(x=>x!==null).length+" answered";el("subject").textContent=q.subject||"General";el("question").textContent=q.q;el("choices").replaceChildren();q.c.forEach((option,i)=>{const b=document.createElement("button");b.type="button";b.className="choice"+(answers[idx]===i?" selected":"");b.textContent=String.fromCharCode(65+i)+". "+option;b.onclick=()=>{answers[idx]=i;skipped.delete(idx);render()};el("choices").append(b)});renderNavigator()}
function renderNavigator(){const subs=["All",...new Set(questions.map(q=>q.subject||"General"))];el("tabs").replaceChildren();subs.forEach(sub=>{const b=document.createElement("button");b.type="button";b.className="tab"+(sub===activeSubject?" active":"");b.textContent=sub;b.setAttribute("aria-pressed",String(sub===activeSubject));b.onclick=()=>{activeSubject=sub;renderNavigator()};el("tabs").append(b)});el("stats").textContent=answers.filter(x=>x!==null).length+" answered · "+skipped.size+" skipped";el("numbers").replaceChildren();questions.forEach((q,i)=>{if(activeSubject!=="All"&&(q.subject||"General")!==activeSubject)return;const b=document.createElement("button");b.type="button";b.className="number"+(answers[i]!==null?" answered":skipped.has(i)?" skipped":"")+(idx===i?" current":"");b.textContent=i+1;b.setAttribute("aria-label","Question "+(i+1)+", "+(answers[i]!==null?"answered":skipped.has(i)?"skipped":"not visited"));b.onclick=()=>jump(i);el("numbers").append(b)})}
function jump(i){if(finished||submitting||i<0||i>=total)return;if(answers[idx]===null&&visited.has(idx))skipped.add(idx);idx=i;visited.add(idx);skipped.delete(idx);render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;el("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(seconds<=0){submit(true);return}seconds--}
el("start").onclick=()=>{const name=el("name").value.trim();if(!name){alert("Enter your full name.");return}el("intro").hidden=true;el("quiz").hidden=false;visited.add(0);render();tick();timer=setInterval(tick,1000)};el("prev").onclick=()=>jump(idx-1);el("next").onclick=()=>jump(idx+1);el("submit").onclick=()=>submit(false);
async function submit(expired){if(finished||submitting)return;const remaining=answers.filter(a=>a===null).length;if(!expired&&remaining&&!confirm(remaining+" questions unanswered. Submit anyway?"))return;submitting=true;el("submit").disabled=true;el("submitError").textContent="";const payload={quiz_id:cfg.id,student_name:el("name").value.trim(),institution:el("institution").value.trim()||"Not provided",answers:answers.map((a,i)=>({questionNumber:i+1,selectedIndex:a}))};try{const response=await fetch(cfg.submissionEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!response.ok)throw Error("Could not confirm submission ("+response.status+").");const result=await response.json();if(result.quiz_id!==cfg.id||!Number.isInteger(result.score)||result.score<0||result.score>total||result.total_questions!==total||!Array.isArray(result.review)||result.review.length!==total)throw Error("Server returned an invalid result.");finished=true;clearInterval(timer);el("quiz").hidden=true;el("result").hidden=false;el("resultTitle").textContent="Score: "+result.score+" / "+total;el("resultSummary").textContent="Percentage: "+(result.score/total*100).toFixed(2)+"%";const review=el("review");review.replaceChildren();result.review.forEach((item,i)=>{const d=document.createElement("div");d.className="review";const heading=document.createElement("strong");heading.textContent=(i+1)+". "+questions[i].q;const info=document.createElement("p");info.textContent="Your answer: "+(answers[i]===null?"Not answered":questions[i].c[answers[i]])+" | Correct: "+(Number.isInteger(item.correctIndex)&&item.correctIndex>=0&&item.correctIndex<4?questions[i].c[item.correctIndex]:"Unavailable");d.append(heading,info);review.append(d)})}catch(error){el("submitError").textContent=error.message+" Your answers are still here; please retry.";el("submit").disabled=false}finally{submitting=false}}
</script></body></html>
