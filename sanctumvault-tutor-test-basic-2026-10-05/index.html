<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SanctumVault Tutor Test</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f8fafc}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:22px;margin-top:18px}h1{margin:0 0 8px}p{color:#cbd5e1}.choice{padding:14px;margin:9px 0;background:#334155;border-radius:10px;cursor:pointer}.choice:hover{background:#475569}.selected{outline:2px solid #22d3ee;background:#164e63}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#a78bfa;color:#172033}.muted{color:#94a3b8;font-size:13px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none}
</style></head>
<body><div class="wrap"><div class="card">
<div class="top"><div><h1 id="title"></h1><div class="muted">General Knowledge • Tutor workflow test</div></div><div id="timer">05:00</div></div>
<div id="intro"><p>Enter your name, then complete all four questions. This submission uses the normal SanctumVault tutor-result system.</p><input id="name" placeholder="Student name" style="width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white"><br><br><button class="btn" id="start">Start Quiz</button></div>
<div id="quiz" class="hidden"><div class="muted">Question <span id="num">1</span> of <span id="total"></span></div><div id="area"></div><button class="btn" id="prev">Previous</button> <button class="btn" id="next">Next</button> <button class="btn" id="submit">Submit</button></div>
<div id="result" class="hidden"><h2 id="score"></h2><p id="msg"></p><a href="https://www.sanctumvault.com.ng/quiz-result" target="_blank" rel="noopener"><button class="btn">Open Result Receipt</button></a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="quiz-config.js"></script><script src="quiz-questions.js"></script>
<script>
const cfg=QUIZ_CONFIG,total=QUESTIONS.length;document.getElementById('title').textContent=cfg.title;document.getElementById('total').textContent=total;
const sb=window.supabase.createClient('https://mgmckntsfukikkmwdsee.supabase.co','sb_publishable_msspxVHxSKf9lZ6oXR-nbw_Ds3QLUTM');
let i=0,answers=Array(total).fill(null),name='',seconds=300,done=false,timer;
function render(){const q=QUESTIONS[i];document.getElementById('num').textContent=i+1;document.getElementById('area').innerHTML='<h2>'+q.q+'</h2>'+q.c.map((x,j)=>'<div class="choice '+(answers[i]===j?'selected':'')+'" data-i="'+j+'">'+String.fromCharCode(65+j)+'. '+x+'</div>').join('');document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{answers[i]=Number(el.dataset.i);render()})}
async function finish(){if(done)return;done=true;clearInterval(timer);const payload=QUESTIONS.map((q,j)=>({questionNumber:j+1,question:q.q,selectedIndex:answers[j],selectedAnswer:answers[j]===null?'No answer':q.c[answers[j]]}));const {data,error}=await sb.rpc('submit_quiz_result',{p_quiz_id:cfg.id,p_quiz_name:cfg.title,p_student_name:name,p_institution:'Not provided',p_score:0,p_total_questions:total,p_percentage:0,p_answers:payload});document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');if(error){document.getElementById('score').textContent='Submission could not be confirmed';document.getElementById('msg').textContent='Please try again.';return}const row=data?.[0];if(row?.result_token){localStorage.setItem('sv_last_quiz_result_token',row.result_token);localStorage.setItem('sv_last_quiz_result_quiz',cfg.id)}if(row?.show_score){document.getElementById('score').textContent='Score: '+row.score+'/'+total;document.getElementById('msg').textContent='Result is available immediately.'}else{document.getElementById('score').textContent='Quiz submitted';document.getElementById('msg').textContent='Your result is waiting for tutor release.'}}
function tick(){let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds--<=0)finish()}
document.getElementById('start').onclick=()=>{name=document.getElementById('name').value.trim();if(!name)return alert('Enter your name');document.getElementById('intro').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();tick();timer=setInterval(tick,1000)};
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<total-1){i++;render()}};document.getElementById('submit').onclick=finish;
</script></body></html>
