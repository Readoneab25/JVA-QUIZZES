<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SanctumVault Tutor Workflow Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:20px;line-height:1.5}
h1{margin-bottom:8px}.q{margin:24px 0;padding:18px;border:1px solid #ddd;border-radius:10px}
button{padding:12px 20px;border:0;border-radius:8px;cursor:pointer}
#result{margin-top:20px;font-weight:bold}
</style>
</head>
<body>
<h1>SanctumVault Tutor Workflow Test</h1>
<p>Temporary 4-question test quiz for Admin Panel verification.</p>
<form id="quiz">
<div class="q"><p>1. What is 2 + 2?</p><label><input type="radio" name="q1" value="0"> 3</label><br><label><input type="radio" name="q1" value="1"> 4</label><br><label><input type="radio" name="q1" value="2"> 5</label><br><label><input type="radio" name="q1" value="3"> 6</label></div>
<div class="q"><p>2. Which is a primary color?</p><label><input type="radio" name="q2" value="0"> Green</label><br><label><input type="radio" name="q2" value="1"> Orange</label><br><label><input type="radio" name="q2" value="2"> Blue</label><br><label><input type="radio" name="q2" value="3"> Purple</label></div>
<div class="q"><p>3. How many days are in a week?</p><label><input type="radio" name="q3" value="0"> 5</label><br><label><input type="radio" name="q3" value="1"> 6</label><br><label><input type="radio" name="q3" value="2"> 7</label><br><label><input type="radio" name="q3" value="3"> 8</label></div>
<div class="q"><p>4. Which planet is known as the Red Planet?</p><label><input type="radio" name="q4" value="0"> Venus</label><br><label><input type="radio" name="q4" value="1"> Jupiter</label><br><label><input type="radio" name="q4" value="2"> Mars</label><br><label><input type="radio" name="q4" value="3"> Saturn</label></div>
<button type="submit">Submit Quiz</button>
</form>
<div id="result"></div>
<script>
document.getElementById('quiz').addEventListener('submit',e=>{
 e.preventDefault();
 const answers=[1,2,2,2];
 let score=0;
 answers.forEach((a,i)=>{const x=document.querySelector('input[name="q'+(i+1)+'"]:checked');if(x&&Number(x.value)===a)score++;});
 document.getElementById('result').textContent='Submitted. Test score: '+score+'/4';
});
</script>
</body>
</html>
